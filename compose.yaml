services:
  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-houseprices}
      POSTGRES_USER: ${POSTGRES_USER:-houseapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [house-price-net]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
  app:
    build: .
    ports: ["${APP_PORT:-5000}:5000"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-houseapp}:${POSTGRES_PASSWORD:?set in .env}@db:5432/${POSTGRES_DB:-houseprices}
      SECRET_KEY: ${SECRET_KEY:?set in .env}
    depends_on:
      db: {condition: service_healthy}
    networks: [house-price-net]
networks: {house-price-net: {name: house-price-net}}
volumes: {pgdata: {name: house-price-pgdata}}
