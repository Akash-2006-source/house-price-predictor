name: tests
on: [push, pull_request]
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest
  publish-registry:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push container image to GHCR
        run: |
          podman build --format docker -t ghcr.io/akash-2006-source/house-price-predictor:v1 -t ghcr.io/akash-2006-source/house-price-predictor:latest -f Containerfile .
          podman push ghcr.io/akash-2006-source/house-price-predictor:v1
          podman push ghcr.io/akash-2006-source/house-price-predictor:latest
